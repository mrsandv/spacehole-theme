name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # No color gets in unless it passes WCAG AA on its own background.
      - name: Validate contrast and structure
        run: node scripts/validate.mjs

      - name: Generate ports
        run: node scripts/build.mjs

      # If this fails, someone edited ports/ by hand instead of tokens.json.
      - name: Check that ports/ is up to date
        run: |
          if [ -n "$(git status --porcelain ports/)" ]; then
            echo "::error::ports/ does not match palette/tokens.json."
            echo "Run 'npm run build' and commit the result."
            git --no-pager diff --stat ports/
            exit 1
          fi
          echo "ports/ is up to date"
